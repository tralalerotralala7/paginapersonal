<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090914"><title>Crear cuenta — Max</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><div class="site-wrap"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">M<span>.</span></span><span>MAX<span class="brand-sub"> / ARCHIVO PERSONAL</span></span></a><nav class="nav-links" aria-label="Navegación principal"><a href="index.html">Inicio</a><a href="Presentacion.html">Sobre mí</a><a href="amigos.html">Mi crew</a><a href="comidas.html">Favoritos</a></nav><a class="button button-small" href="login.html">Iniciar sesión <span>↗</span></a></header>
<main class="page-main"><section class="form-panel"><p class="page-kicker">[ NUEVA CUENTA // REGISTRO ]</p><h1>Sumate.</h1><p>Creá tu acceso al archivo personal.</p><form id="formRegistro"><div class="form-group"><label for="nombre">Nombre</label><input type="text" id="nombre" name="nombre" autocomplete="name" required></div><div class="form-group"><label for="email">Correo electrónico</label><input type="email" id="email" name="email" autocomplete="email" required></div><div class="form-group"><label for="password">Contraseña</label><input type="password" id="password" name="password" autocomplete="new-password" required></div><input type="submit" value="Crear cuenta"></form><div class="volver-login">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></div></section></main>
<footer class="site-footer"><a class="brand footer-brand" href="index.html"><span class="brand-mark">M<span>.</span></span><span>MAX</span></a><span>HECHO CON CURIOSIDAD Y UN POCO DE NEÓN.</span><span>© 2025 — TRANSMISIÓN FINALIZADA</span></footer></div>
<script>const form=document.getElementById('formRegistro');form.addEventListener('submit',(e)=>{e.preventDefault();const nombre=document.getElementById('nombre').value.trim();const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;if(!nombre||!email||!password){alert('Por favor completa todos los campos.');return;}const usuario={nombre,email,password};localStorage.setItem('usuarioRegistrado',JSON.stringify(usuario));alert('¡Registro exitoso!');window.location.href='login.html';});</script></body></html>
