<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#090914"><title>Iniciar sesión — Max</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><div class="site-wrap"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">M<span>.</span></span><span>MAX<span class="brand-sub"> / ARCHIVO PERSONAL</span></span></a><nav class="nav-links" aria-label="Navegación principal"><a href="index.html">Inicio</a><a href="Presentacion.html">Sobre mí</a><a href="amigos.html">Mi crew</a><a href="comidas.html">Favoritos</a></nav><a class="button button-small" href="registro.html">Crear cuenta <span>↗</span></a></header>
<main class="page-main"><section class="form-panel"><p class="page-kicker">[ ACCESO // IDENTIFICACIÓN ]</p><h1>Volviste.</h1><p>Iniciá sesión para continuar.</p><form id="formLogin"><div class="form-group"><label for="usuario">Correo electrónico</label><input type="email" id="usuario" name="usuario" autocomplete="email" required></div><div class="form-group"><label for="password">Contraseña</label><input type="password" id="password" name="password" autocomplete="current-password" required></div><input type="submit" value="Iniciar sesión"><div class="registrarse">¿Todavía no tenés cuenta? <a href="registro.html">Registrate</a></div></form></section></main>
<footer class="site-footer"><a class="brand footer-brand" href="index.html"><span class="brand-mark">M<span>.</span></span><span>MAX</span></a><span>HECHO CON CURIOSIDAD Y UN POCO DE NEÓN.</span><span>© 2025 — TRANSMISIÓN FINALIZADA</span></footer></div>
<script>const formLogin=document.getElementById('formLogin');formLogin.addEventListener('submit',(e)=>{e.preventDefault();const emailIngresado=document.getElementById('usuario').value.trim();const passwordIngresado=document.getElementById('password').value;const usuarioGuardado=JSON.parse(localStorage.getItem('usuarioRegistrado'));if(usuarioGuardado&&emailIngresado===usuarioGuardado.email&&passwordIngresado===usuarioGuardado.password){alert('Inicio de sesión exitoso');window.location.href='index.html';}else{alert('Correo o contraseña incorrectos');}});</script></body></html>
